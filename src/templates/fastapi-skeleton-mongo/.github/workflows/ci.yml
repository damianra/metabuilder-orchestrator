name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && pip-audit
      - run: python -m pytest
      # En apps fullstack el package.json del frontend convive con el
      # backend python — los tests vitest corren solo si existe.
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
        if: ${{ hashFiles('package.json') != '' }}
