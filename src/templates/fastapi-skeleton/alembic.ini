# Alembic — migraciones de schema. `alembic upgrade head` aplica lo
# pendiente; la app lo corre sola en init_db() al arrancar.
# sqlalchemy.url se resuelve en alembic/env.py (DATABASE_URL de env/.env).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./app.db
